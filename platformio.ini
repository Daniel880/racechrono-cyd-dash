; Wyswietlacz do RaceChrono (BLE Monitor API) na CYD (ESP32-2432S028, ST7789)

[env:cyd]
; oficjalna platforma PlatformIO 8.x = Arduino-ESP32 3.3.x (wymagane przez NimBLE 2.x)
platform = platformio/espressif32@^8.0.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board = esp32dev
upload_speed = 460800
; jedna duza partycja aplikacji (3 MB)
board_build.partitions = huge_app.csv
build_flags =
    ; backup trasy na karte SD: /gpx/RRRR-MM-DD_GG-MM-SS.gpx + .nmea (czas UTC pierwszego fixa,
    ; nowa para przy kazdym starcie)
    -DGPX_LOG
    ; symulowany GPS (kolo ~20 s, 10 Hz) wysylany do RaceChrono.
    ; Dla prawdziwego modulu: zakomentuj SIM_GPS i odkomentuj blok GPS ponizej.
    ; -DSIM_GPS
    ; modul GPS GEPRC M10 (u-blox M10) na zlaczu CN1: GPS TX -> IO27, GPS RX <- IO22, GND
    -DGPS_UART_RX=27
    -DGPS_UART_TX=22
    ; autokonfiguracja M10 przy starcie: wykrycie predkosci, 10 Hz, automotive, RMC+GGA
    -DGPS_UBLOX_M10
    -DGPS_UART_BAUD=115200
    -DGPS_RATE_HZ=10
    ; diagnostyka (odkomentuj): surowe wartosci / statystyki odbioru / okrazenia symulatora
    ; co sekunde na Serial: B/s i zdania NMEA z GPS, satelity, fix, ostatnia linia
    -DGPS_DEBUG
    ; -DRC_DEBUG_VALUES
    ; -DRC_DEBUG_STATS
    ; -DSIM_DEBUG
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2
    lovyan03/LovyanGFX@^1.3.0
    mikalhart/TinyGPSPlus@^1.1.0
