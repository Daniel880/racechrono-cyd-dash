; Wyswietlacz do RaceChrono (BLE Monitor API) na CYD (ESP32-2432S028, ST7789)

[platformio]
; zwykly Build/Upload = kabel USB (cyd); przez WiFi trzeba wybrac srodowisko cyd_ota
default_envs = cyd

[ota]
; haslo sieci WiFi wyswietlacza i wgrywania (min. 8 znakow)
password = 12345678

[env:cyd]
; oficjalna platforma PlatformIO 8.x = Arduino-ESP32 3.3.x (wymagane przez NimBLE 2.x)
platform = platformio/espressif32@^8.0.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board = esp32dev
upload_speed = 460800
; wersja programu z gita (hash commita + data kompilacji): ekran powitalny, strona Stan, log
extra_scripts = pre:tools/version.py
; dwie partycje aplikacji po 1.9 MB - wgrywanie przez WiFi zapisuje nowy program do drugiej
board_build.partitions = min_spiffs.csv
build_flags =
    ; backup trasy na karte SD: /gpx/RRRR-MM-DD_GG-MM-SS.gpx + .ubx (czas UTC pierwszego fixa,
    ; nowa para przy kazdym starcie). .ubx = surowe ramki z modulu GPS do analizy po jezdzie.
    -DGPX_LOG
    ; symulowany GPS (kolo ~20 s, 10 Hz) wysylany do RaceChrono - zamiast modulu, nie razem z nim
    ; (blad kompilacji). Dla prawdziwego modulu: zakomentuj SIM_GPS i odkomentuj blok GPS ponizej.
    ; -DSIM_GPS
    ; modul GPS GEPRC M10 (u-blox M10) na zlaczu CN1: GPS TX -> IO27, GPS RX <- IO22, GND.
    ; Konfiguracja przy starcie i po resecie modulu: wykrycie predkosci, czestotliwosc i systemy
    ; wg trybu GPS, automotive, protokol UBX: NAV-PVT + NAV-DOP w kazdej epoce, raz na sekunde
    ; NAV-SAT, NAV-STATUS, MON-RF, MON-SPAN, MON-COMMS (zapis na SD i strona /gps)
    -DGPS_UART_RX=27
    -DGPS_UART_TX=22
    -DGPS_UART_BAUD=115200
    ; domyslny tryb GPS - obowiazuje do pierwszej zmiany na stronie WiFi (http://192.168.4.1):
    ;   25 = 25 Hz, sam GPS              - najwiecej punktow, najmniej satelitow
    ;   20 = 20 Hz, GPS + Galileo        - kompromis
    ;   10 = 10 Hz, GPS+Galileo+BeiDou - najwiecej satelitow, najlepszy HDOP
    -DGPS_MODE=20
    ; wgrywanie przez WiFi: przez 30 s po starcie siec "RC-CYD-OTA" (haslo z [ota]), potem WiFi
    ; wylaczone, chyba ze ktos sie podlaczyl. Wgrywanie: strona http://192.168.4.1 (plik
    ; .pio/build/cyd/firmware.bin) albo srodowisko cyd_ota ponizej.
    -DOTA_WIFI
    '-DOTA_PASSWORD="${ota.password}"'
    ; Bluetooth tylko w roli, ktorej uzywamy (urzadzenie, z ktorym laczy sie telefon) i jedno
    ; polaczenie naraz (program i tak obsluguje jedno) - kilka kB RAM wiecej dla WiFi
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; diagnostyka (odkomentuj): surowe wartosci / statystyki odbioru / okrazenia symulatora
    ; -DRC_DEBUG_VALUES
    ; -DRC_DEBUG_STATS
    ; -DSIM_DEBUG
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2
    lovyan03/LovyanGFX@^1.3.0
    ; karta SD (zamiast SD.h z ESP32: ~20 kB mniej RAM, obsluguje tez exFAT)
    greiman/SdFat@^2.3.1

; Wgrywanie przez WiFi: w ciagu 30 s od wlaczenia wyswietlacza podlacz laptop do sieci
; RC-CYD-OTA (haslo z [ota]), potem Upload w tym srodowisku. Pierwszy raz po zmianie
; partycji trzeba wgrac przez USB (srodowisko cyd).
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=${ota.password}
